buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.0'
        classpath 'com.mobidevelop.robovm:robovm-gradle-plugin:2.3.13'
    }
}

allprojects {

    ext {
        appName = 'Abyssalnite Pixel Dungeon'
        appPackageName = 'com.tatara.abyssalnitepixeldungeon'

        appVersionCode = 464
        appVersionName = '0.1.5'

        appJavaCompatibility = JavaVersion.VERSION_1_8

        appAndroidCompileSDK = 30
        appAndroidMinSDK = 19
        appAndroidTargetSDK = 30

        gdxVersion = '1.9.10'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    }

}